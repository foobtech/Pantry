name: PantryCore CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift (Linux)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Live repo smoke test
        continue-on-error: true
        run: swift run pantry-cli https://repo.chariz.com --ios 16.5 --scheme rootless
