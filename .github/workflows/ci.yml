name: PantryCore CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift (Linux)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Live repo smoke test
        continue-on-error: true
        run: swift run pantry-cli https://repo.chariz.com --ios 16.5 --scheme rootless

  helper-deb:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install dpkg ldid

      - name: Build helper .deb
        run: ./packaging/build-helper-deb.sh

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: pantry-helper-deb
          path: build/*.deb
